version: "3.9"

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - ./queue/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf

  orchestrator:
    build: ./orchestrator
    ports:
      - "8000:8000"
    depends_on:
      - redis
    volumes:
      - ./registry:/app/registry
      - ./tasks:/app/tasks
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  worker:
    build: ./worker
    depends_on:
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./registry:/app/registry
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    deploy:
      replicas: 3
